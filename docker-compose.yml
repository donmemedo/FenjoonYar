# Both services are published on loopback only (BIND_ADDR). Put a TLS reverse proxy in front of web that
# sets X-Forwarded-For to the client address: per-IP rate limits depend on it (see TRUSTED_PROXIES).
x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  api:
    <<: *hardening
    build: ./backend
    container_name: cups_api
    environment:
      ENV: ${APP_ENV:-production}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      DEMO_MODE: ${DEMO_MODE:-0}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3044,http://127.0.0.1:3044}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-1}
      DATABASE_URL: sqlite:///./data/cups.db
    volumes:
      - api_data:/srv/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8044:8000"
    pids_limit: 128
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    <<: *hardening
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://api:8000
    container_name: cups_web
    environment:
      API_INTERNAL_URL: http://api:8000
      ENABLE_HSTS: ${ENABLE_HSTS:-0}
    depends_on:
      api:
        condition: service_healthy
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /app/.next/cache:rw,noexec,nosuid,size=128m
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3044:3044"
    pids_limit: 256
    mem_limit: 768m

volumes:
  api_data:
