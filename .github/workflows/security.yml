# DevSecOps pipeline: tests, SAST, dependency audit, secret scan, container scan, CodeQL.
# Third-party actions are pinned to commit hashes. Dependabot (see dependabot.yml) updates them.
name: security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # weekly re-scan: new advisories appear against unchanged code
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "backend/requirements*.txt" }
      - name: Install
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt bandit pip-audit
      - name: Unit and attack-path tests
        working-directory: backend
        env:
          ENV: test
          JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
        run: python -m pytest -q
      - name: SAST (bandit, medium and above)
        working-directory: backend
        run: bandit -r app -ll -ii
      - name: Dependency audit (known advisories)
        working-directory: backend
        run: pip-audit -r requirements.txt --strict

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - name: Dependency audit (production, high and above)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Production build
        run: npm run build
        env: { API_INTERNAL_URL: "http://api:8000", NEXT_TELEMETRY_DISABLED: "1" }

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: { image: "semgrep/semgrep:latest" } # ponytail: pin by digest once the registry is mirrored
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: semgrep scan --error --config p/python --config p/typescript --config p/owasp-top-ten --config p/secrets backend/app frontend/src

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with: { dockerfile: backend/Dockerfile }
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with: { dockerfile: frontend/Dockerfile }
      - name: Build images
        run: |
          docker build -t cups-api:ci backend
          docker build -t cups-web:ci --build-arg API_INTERNAL_URL=http://api:8000 frontend
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { image-ref: "cups-api:ci", severity: "CRITICAL,HIGH", exit-code: "1", ignore-unfixed: true }
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { image-ref: "cups-web:ci", severity: "CRITICAL,HIGH", exit-code: "1", ignore-unfixed: true }

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read, security-events: write }
    strategy:
      matrix: { language: [python, javascript-typescript] }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        with: { languages: "${{ matrix.language }}", queries: security-extended }
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
